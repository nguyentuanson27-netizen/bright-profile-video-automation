services:
  bright-evidence-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    restart: unless-stopped
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 4190
      MCP_ALLOWED_HOSTS: 127.0.0.1,localhost
      MCP_MAX_BODY_BYTES: 2097152
      MCP_RATE_LIMIT_PER_MINUTE: 60
      MCP_REQUEST_TIMEOUT_MS: 10000
    ports:
      - "127.0.0.1:4190:4190"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4190/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    cpus: 0.5
    mem_limit: 256m
