name: T18 Standalone Deployment Verification

on:
  push:
    branches:
      - build/standalone-production-app

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BRIGHT_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
      APP_DOMAIN: localhost
      BRIGHT_EDGE_NETWORK: bright-edge-ci
      BRIGHT_EDGE_CIDR: 172.31.250.0/29
      GITHUB_ALLOWED_USERS: ci-user
      GITHUB_OAUTH_CLIENT_ID: ci-client
      GITHUB_OAUTH_CLIENT_SECRET_FILE: ${{ github.workspace }}/.ci-secrets/github-oauth-client-secret
      OAUTH2_PROXY_COOKIE_SECRET_FILE: ${{ github.workspace }}/.ci-secrets/oauth2-proxy-cookie-secret
      GEMINI_API_KEY_FILE: ${{ github.workspace }}/.ci-secrets/gemini-api-key
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Kore
      GEMINI_TTS_TIMEOUT_MS: 30000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --strict-allow-scripts=true --no-audit --no-fund
      - name: Verify Google GenAI SDK runtime construction
        run: node -e "import('@google/genai').then(({GoogleGenAI})=>{const c=new GoogleGenAI({apiKey:'ci-key'});if(!c.interactions)process.exit(1)})"
      - name: Run focused T18 regression tests
        run: node --test tests/unit/gemini-research.test.mjs tests/unit/gemini-generation.test.mjs tests/unit/gemini-tts.test.mjs tests/unit/timed-gemini-tts.test.mjs tests/unit/gemini-secret-file.test.mjs tests/integration/gemini-tts-wiring.test.mjs tests/integration/standalone-web.test.mjs tests/integration/deployment-config.test.mjs
      - run: npm run lint
      - name: Verify production entrypoint syntax
        run: |
          node --check server.mjs
          node --check worker.mjs
          node --check scripts/cleanup.mjs
          node --check scripts/backup.mjs
      - name: Resolve local browser and ffmpeg for full regression
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version >/dev/null
          echo "REMOTION_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"
      - name: Run full regression suite
        run: npm test
      - name: Build production web assets
        run: |
          npm run build
          test -s dist/web/index.html
      - name: Create local-only CI secret files
        run: |
          mkdir -p .ci-secrets
          chmod 700 .ci-secrets
          printf '%s' 'ci-gemini-key' > .ci-secrets/gemini-api-key
          printf '%s' 'ci-github-client-secret' > .ci-secrets/github-oauth-client-secret
          python3 - <<'PY'
          from pathlib import Path
          Path('.ci-secrets/oauth2-proxy-cookie-secret').write_bytes(b'x' * 32)
          PY
          chmod 444 .ci-secrets/*
      - name: Create dedicated external shared-edge network
        run: docker network create --driver bridge --subnet "$BRIGHT_EDGE_CIDR" "$BRIGHT_EDGE_NETWORK"
      - name: Validate resolved Compose topology
        run: |
          docker compose config --format json > "$RUNNER_TEMP/bright-compose.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ['RUNNER_TEMP']).joinpath('bright-compose.json').read_text())
          services = data['services']
          assert set(services) == {'app', 'worker', 'oauth2-proxy'}
          assert services['app']['image'] == services['worker']['image'] == os.environ['BRIGHT_IMAGE']
          for name in services:
              assert not services[name].get('ports')
          assert set(services['oauth2-proxy'].get('networks', {})) == {'backend', 'edge'}
          assert set(services['app'].get('networks', {})) == {'backend'}
          assert set(services['worker'].get('networks', {})) == {'backend'}
          aliases = services['oauth2-proxy']['networks']['edge'].get('aliases', [])
          assert 'bright-standalone-oauth2-proxy' in aliases
          assert data['networks']['edge']['external'] is True
          assert data['networks']['edge']['name'] == os.environ['BRIGHT_EDGE_NETWORK']
          app_env = services['app'].get('environment', {})
          worker_env = services['worker'].get('environment', {})
          assert 'GEMINI_API_KEY' not in app_env
          assert 'GEMINI_API_KEY_FILE' not in app_env
          assert not services['app'].get('secrets')
          assert 'GEMINI_API_KEY' not in worker_env
          assert worker_env.get('GEMINI_API_KEY_FILE') == '/run/secrets/gemini_api_key'
          assert worker_env.get('GEMINI_MODEL') == 'gemini-3.5-flash-lite'
          assert worker_env.get('GEMINI_TTS_MODEL') == 'gemini-3.1-flash-tts-preview'
          assert worker_env.get('GEMINI_TTS_VOICE') == 'Kore'
          assert worker_env.get('GEMINI_TTS_TIMEOUT_MS') == '30000'
          assert 'GOOGLE_APPLICATION_CREDENTIALS' not in worker_env
          assert not any(key.startswith('GOOGLE_TTS_') for key in worker_env)
          worker_secrets = services['worker'].get('secrets') or []
          assert worker_secrets
          assert 'gemini_api_key' in data.get('secrets', {})
          assert 'google_tts_credentials' not in data.get('secrets', {})
          assert 'openai_api_key' not in data.get('secrets', {})
          PY
      - name: Build immutable standalone app image
        run: docker build --tag "$BRIGHT_IMAGE" .
      - name: Probe non-root runtime image and shared data volume
        run: |
          docker run --rm --entrypoint node "$BRIGHT_IMAGE" -e "const fs=require('node:fs'); if(process.getuid()===0)process.exit(1); if(!fs.existsSync('/app/dist/web/index.html'))process.exit(1)"
          docker compose run --rm --no-deps --entrypoint node app -e "const fs=require('node:fs'); fs.writeFileSync('/app/data/ci-volume-probe','probe'); if(fs.readFileSync('/app/data/ci-volume-probe','utf8')!=='probe')process.exit(1)"
      - name: Start and verify private app role
        run: |
          docker compose up -d --no-deps app
          container="$(docker compose ps -q app)"
          test -n "$container"
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container")"
            if [ "$status" = healthy ]; then break; fi
            if [ "$status" = unhealthy ]; then exit 1; fi
            sleep 2
          done
          test "$(docker inspect --format='{{.State.Health.Status}}' "$container")" = healthy
          test "$(docker compose exec -T app id -u)" != 0
          docker inspect "$container" | node -e "let s='';process.stdin.setEncoding('utf8');process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{const b=JSON.parse(s)[0].HostConfig.PortBindings||{};if(Object.keys(b).length)process.exit(1)})"
          test -z "$(docker inspect --format='{{range .Mounts}}{{if eq .Destination \"/run/secrets/gemini_api_key\"}}mounted{{end}}{{end}}' "$container")"
          docker compose exec -T app node -e "fetch('http://127.0.0.1:4180/health/ready').then(async r=>{if(!r.ok)process.exit(1);const b=await r.json();if(!b.ok)process.exit(1)})"
      - name: Start and verify private worker role
        run: |
          docker compose up -d worker
          container="$(docker compose ps -q worker)"
          test -n "$container"
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container")"
            if [ "$status" = healthy ]; then break; fi
            if [ "$status" = unhealthy ]; then exit 1; fi
            sleep 2
          done
          test "$(docker inspect --format='{{.State.Health.Status}}' "$container")" = healthy
          test "$(docker compose exec -T worker id -u)" != 0
          docker inspect "$container" | node -e "let s='';process.stdin.setEncoding('utf8');process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{const b=JSON.parse(s)[0].HostConfig.PortBindings||{};if(Object.keys(b).length)process.exit(1)})"
          docker compose exec -T worker node -e "fetch('http://127.0.0.1:4181/health/ready').then(async r=>{if(!r.ok)process.exit(1);const b=await r.json();if(!b.ok)process.exit(1)})"
          docker compose exec -T worker node -e "const fs=require('node:fs');if(!fs.statSync('/run/secrets/gemini_api_key').isFile())process.exit(1);if(fs.existsSync('/run/secrets/google_tts_credentials'))process.exit(1)"
          docker compose exec -T app node -e "require('node:fs').writeFileSync('/app/data/ci-shared-volume','shared')"
          docker compose exec -T worker node -e "if(require('node:fs').readFileSync('/app/data/ci-shared-volume','utf8')!=='shared')process.exit(1)"
      - name: Start and verify private OAuth role
        run: |
          docker compose up -d oauth2-proxy
          container="$(docker compose ps -q oauth2-proxy)"
          test -n "$container"
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container")"
            if [ "$status" = healthy ]; then break; fi
            if [ "$status" = unhealthy ]; then exit 1; fi
            sleep 2
          done
          test "$(docker inspect --format='{{.State.Health.Status}}' "$container")" = healthy
          docker inspect "$container" | node -e "let s='';process.stdin.setEncoding('utf8');process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{const b=JSON.parse(s)[0].HostConfig.PortBindings||{};if(Object.keys(b).length)process.exit(1)})"
      - name: Start external shared Caddy and verify unauthenticated isolation
        run: |
          docker run -d --name bright-shared-caddy-ci \
            --network "$BRIGHT_EDGE_NETWORK" \
            -e APP_DOMAIN=localhost \
            -p 80:80 -p 443:443 \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine
          caddy_container="$(docker inspect --format='{{.Id}}' bright-shared-caddy-ci)"
          docker inspect "$caddy_container" | node -e "let s='';process.stdin.setEncoding('utf8');process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{const b=JSON.parse(s)[0].HostConfig.PortBindings||{};for(const p of ['80/tcp','443/tcp'])if(!Array.isArray(b[p])||b[p].length===0)process.exit(1)})"
          status=000
          for attempt in $(seq 1 60); do
            status="$(curl -k -sS -o "$RUNNER_TEMP/edge-body" -D "$RUNNER_TEMP/edge-headers" -w '%{http_code}' https://localhost/ || true)"
            if [ "$status" != 000 ]; then break; fi
            sleep 2
          done
          test "$status" != 000
          test "$status" != 200
          ! grep -q 'Creator intelligence to video' "$RUNNER_TEMP/edge-body"
          grep -Eqi '^location: (https://github.com/login/oauth/authorize|/oauth2/)' "$RUNNER_TEMP/edge-headers"
      - name: Diagnose private service startup
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color app worker oauth2-proxy || true
          docker logs bright-shared-caddy-ci 2>/dev/null || true
          for service in app worker oauth2-proxy; do
            container="$(docker compose ps -aq "$service" 2>/dev/null || true)"
            if [ -z "$container" ]; then continue; fi
            docker inspect --format='service='"$service"' name={{.Name}} user={{.Config.User}} status={{.State.Status}} exit={{.State.ExitCode}} error={{json .State.Error}} health={{json .State.Health}} mounts={{range .Mounts}}{{.Destination}}={{.Source}}:rw={{.RW}} {{end}}' "$container" || true
          done
      - name: Inspect final service state
        run: |
          docker compose ps
          docker compose exec -T app node -e "fetch('http://127.0.0.1:4180/health/ready').then(async r=>{if(!r.ok)process.exit(1);const b=await r.json();if(!b.ok)process.exit(1)})"
          docker compose exec -T worker node -e "fetch('http://127.0.0.1:4181/health/ready').then(async r=>{if(!r.ok)process.exit(1);const b=await r.json();if(!b.ok)process.exit(1)})"
      - name: Publish verified immutable image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$BRIGHT_IMAGE"
          docker logout ghcr.io
      - name: Tear down integration stack
        if: always()
        run: |
          docker rm -f bright-shared-caddy-ci 2>/dev/null || true
          docker compose down -v --remove-orphans
          docker network rm "$BRIGHT_EDGE_NETWORK" 2>/dev/null || true
