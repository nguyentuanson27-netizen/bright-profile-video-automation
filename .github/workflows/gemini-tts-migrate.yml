name: Gemini TTS Migration

on:
  push:
    branches:
      - build/standalone-production-app

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Patch Gemini TTS production wiring
        run: |
          python3 scripts/migrate-gemini-tts.py
          git checkout -- .github/workflows/t18-static-web.yml
          git rm lib/timed-google-tts.mjs scripts/generate-google-tts.py scripts/generate-timed-google-tts.py scripts/migrate-gemini-tts.py
      - name: Refresh frozen lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify strict frozen install
        run: npm ci --strict-allow-scripts=true --no-audit --no-fund
      - name: Run focused migration tests
        run: node --test tests/unit/gemini-tts.test.mjs tests/unit/timed-gemini-tts.test.mjs tests/integration/gemini-tts-wiring.test.mjs tests/integration/render-worker.test.mjs tests/integration/deployment-config.test.mjs
      - run: npm run lint
      - name: Commit migration only after verification
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: replace Google Cloud TTS with Gemini TTS"
          git push origin HEAD:build/standalone-production-app
