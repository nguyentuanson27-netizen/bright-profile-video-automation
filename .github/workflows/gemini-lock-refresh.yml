name: Gemini Lockfile Refresh

on:
  push:
    branches:
      - build/standalone-production-app

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/standalone-production-app
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Refresh lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify provider SDK pins
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages[''];
          if (root.dependencies['@google/genai'] !== '2.14.0') throw new Error('Gemini SDK pin missing');
          if ('openai' in root.dependencies) throw new Error('OpenAI SDK still present in root dependencies');
          NODE
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m 'chore: refresh lockfile for Gemini SDK'
          git push origin HEAD:build/standalone-production-app
