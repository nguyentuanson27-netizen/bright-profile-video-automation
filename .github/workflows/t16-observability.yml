name: T16 Observability Verification

on:
  push:
    branches:
      - build/standalone-production-app

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --strict-allow-scripts=true --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node --test tests/unit/config.test.mjs tests/integration/observability.test.mjs tests/integration/render-worker.test.mjs
      - run: node --check server.mjs
      - run: node --check worker.mjs
      - run: npm test
      - run: npm run build
      - run: test -s dist/web/index.html
      - run: npm run lint
