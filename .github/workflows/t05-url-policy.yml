name: Checkpoint A Verification

on:
  push:
    branches:
      - build/standalone-production-app

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Frozen install
        run: npm ci --strict-allow-scripts=true --no-audit --no-fund
      - name: Storage integration tests
        run: node --test tests/integration/storage.test.mjs
      - name: Durable recovery tests
        run: node --test tests/integration/jobs.test.mjs
      - name: URL policy abuse tests
        run: node --test tests/unit/url-policy.test.mjs
      - name: Full test suite
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Existing render smoke
        shell: bash
        run: |
          test -x /usr/bin/google-chrome
          mkdir -p data
          REMOTION_BROWSER_EXECUTABLE=/usr/bin/google-chrome npm run render:smoke
          test -s data/bright-profile-smoke.mp4
