name: T01-T02 Checkpoint Verification

on:
  push:
    branches:
      - build/standalone-production-app

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Refresh lockfile from pinned package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Frozen install
        run: npm ci --strict-allow-scripts=true --no-audit --no-fund
      - name: Full test suite
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Existing render smoke
        shell: bash
        run: |
          test -x /usr/bin/google-chrome
          mkdir -p data
          REMOTION_BROWSER_EXECUTABLE=/usr/bin/google-chrome npm run render:smoke
          test -s data/bright-profile-smoke.mp4
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: refresh approved dependency lock [skip ci]'
          git push origin HEAD
