name: T17 Storage Operations Verification

on:
  push:
    branches:
      - build/standalone-production-app

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --strict-allow-scripts=true --no-audit --no-fund
      - run: node --test tests/unit/config.test.mjs tests/integration/storage-ops.test.mjs tests/integration/media-ingest.test.mjs tests/integration/render-worker.test.mjs tests/integration/disk-metrics.test.mjs
      - run: npm run lint
