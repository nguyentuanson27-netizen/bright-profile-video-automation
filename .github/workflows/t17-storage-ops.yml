name: T17 Storage Operations Verification

on:
  push:
    branches:
      - build/standalone-production-app

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --strict-allow-scripts=true --no-audit --no-fund
      - run: node --test tests/unit/config.test.mjs tests/integration/storage-ops.test.mjs tests/integration/media-ingest.test.mjs tests/integration/render-worker.test.mjs tests/integration/disk-metrics.test.mjs
      - run: node --check server.mjs
      - run: node --check worker.mjs
      - run: node --check scripts/cleanup.mjs
      - run: node --check scripts/backup.mjs
      - run: npm run lint
      - name: Smoke storage operator commands
        run: |
          export DATA_DIR="$RUNNER_TEMP/bright-storage-smoke"
          npm run storage:cleanup
          npm run storage:backup -- --name ci-smoke
          test -s "$DATA_DIR/backups/ci-smoke/app.sqlite"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: test -x /usr/bin/google-chrome
      - run: npm test
        env:
          REMOTION_BROWSER_EXECUTABLE: /usr/bin/google-chrome
      - run: npm run build
      - run: test -s dist/web/index.html
