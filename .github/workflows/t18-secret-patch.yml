name: T18 Mounted Secret Patch

on:
  push:
    branches:
      - build/standalone-production-app

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/standalone-production-app
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply narrow mounted-secret patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for file in [Path('providers/research/openai.mjs'), Path('providers/generation/openai.mjs')]:
              text = file.read_text()
              import_anchor = "import {AppError} from '../../domain/errors.mjs';\n"
              import_line = "import {loadSecretValue} from '../../security/secret-file.mjs';\n"
              if import_line not in text:
                  assert text.count(import_anchor) == 1, file
                  text = text.replace(import_anchor, import_anchor + import_line)
              old = "  const apiKey = String(env.OPENAI_API_KEY || '').trim();"
              new = "  const apiKey = loadSecretValue({\n    env,\n    valueKey: 'OPENAI_API_KEY',\n    fileKey: 'OPENAI_API_KEY_FILE',\n    errorFactory: configError,\n  });"
              if old in text:
                  assert text.count(old) == 1, file
                  text = text.replace(old, new)
              else:
                  assert new in text, file
              file.write_text(text)

          compose = Path('compose.yml')
          text = compose.read_text()
          old_env = '      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}\n'
          assert text.count(old_env) in (0, 2)
          text = text.replace(old_env, '      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key\n')

          app_volume = '    volumes:\n      - bright_data:/app/data\n    expose:\n'
          app_secret = '    volumes:\n      - bright_data:/app/data\n    secrets:\n      - openai_api_key\n    expose:\n'
          if app_secret not in text:
              assert text.count(app_volume) == 1
              text = text.replace(app_volume, app_secret, 1)

          worker_secret_old = '    secrets:\n      - google_tts_credentials\n'
          worker_secret_new = '    secrets:\n      - openai_api_key\n      - google_tts_credentials\n'
          if worker_secret_new not in text:
              assert text.count(worker_secret_old) == 1
              text = text.replace(worker_secret_old, worker_secret_new)

          secrets_anchor = 'secrets:\n  github_oauth_client_secret:\n'
          secrets_new = 'secrets:\n  openai_api_key:\n    file: ${OPENAI_API_KEY_FILE:?set OPENAI_API_KEY_FILE}\n  github_oauth_client_secret:\n'
          if secrets_new not in text:
              assert text.count(secrets_anchor) == 1
              text = text.replace(secrets_anchor, secrets_new)
          compose.write_text(text)

          env_file = Path('.env.example')
          text = env_file.read_text()
          old = 'OPENAI_API_KEY=replace-with-openai-api-key\n'
          new = 'OPENAI_API_KEY_FILE=/srv/bright-profile/secrets/openai-api-key\n'
          if old in text:
              assert text.count(old) == 1
              text = text.replace(old, new)
          else:
              assert new in text
          env_file.write_text(text)
          PY
      - run: npm ci --strict-allow-scripts=true --no-audit --no-fund
      - run: node --test tests/unit/openai-secret-file.test.mjs tests/unit/openai-research.test.mjs tests/unit/openai-generation.test.mjs tests/integration/deployment-config.test.mjs
      - run: npm run lint
      - name: Commit verified patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add providers/research/openai.mjs providers/generation/openai.mjs compose.yml .env.example
          git commit -m "build: mount OpenAI key as production secret"
          git push origin HEAD:build/standalone-production-app
