name: Patch T18 for Gemini

on:
  push:
    branches:
      - build/standalone-production-app

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/standalone-production-app
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --strict-allow-scripts=true --no-audit --no-fund
      - name: Patch permanent T18 workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/t18-static-web.yml')
          s = p.read_text()
          replacements = [
            ("      OPENAI_API_KEY_FILE: ${{ github.workspace }}/.ci-secrets/openai-api-key\n      OPENAI_RESEARCH_MODEL: gpt-5-2026-08-07\n      OPENAI_GENERATION_MODEL: gpt-5-2026-08-07\n", "      GEMINI_API_KEY_FILE: ${{ github.workspace }}/.ci-secrets/gemini-api-key\n      GEMINI_MODEL: gemini-3.5-flash-lite\n"),
            ("      - run: npm ci --strict-allow-scripts=true --no-audit --no-fund\n", "      - run: npm ci --strict-allow-scripts=true --no-audit --no-fund\n      - name: Verify Google GenAI SDK runtime construction\n        run: node -e \"import('@google/genai').then(({GoogleGenAI})=>{const c=new GoogleGenAI({apiKey:'ci-key'});if(!c.interactions)process.exit(1)})\"\n"),
            ("run: node --test tests/unit/openai-secret-file.test.mjs tests/integration/standalone-web.test.mjs tests/integration/deployment-config.test.mjs", "run: node --test tests/unit/gemini-secret-file.test.mjs tests/integration/standalone-web.test.mjs tests/integration/deployment-config.test.mjs"),
            ("printf '%s' 'ci-openai-key' > .ci-secrets/openai-api-key", "printf '%s' 'ci-gemini-key' > .ci-secrets/gemini-api-key"),
            ("          assert 'OPENAI_API_KEY' not in app_env\n          assert 'OPENAI_API_KEY_FILE' not in app_env\n", "          assert 'GEMINI_API_KEY' not in app_env\n          assert 'GEMINI_API_KEY_FILE' not in app_env\n"),
            ("          assert 'OPENAI_API_KEY' not in worker_env\n          assert worker_env.get('OPENAI_API_KEY_FILE') == '/run/secrets/openai_api_key'\n          assert services['worker'].get('secrets')\n          assert 'openai_api_key' in data.get('secrets', {})\n", "          assert 'GEMINI_API_KEY' not in worker_env\n          assert worker_env.get('GEMINI_API_KEY_FILE') == '/run/secrets/gemini_api_key'\n          assert worker_env.get('GEMINI_MODEL') == 'gemini-3.5-flash-lite'\n          assert services['worker'].get('secrets')\n          assert 'gemini_api_key' in data.get('secrets', {})\n          assert 'openai_api_key' not in data.get('secrets', {})\n"),
            ("/run/secrets/openai_api_key", "/run/secrets/gemini_api_key"),
          ]
          for old, new in replacements:
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'expected exactly one replacement, got {count}: {old[:80]!r}')
            s = s.replace(old, new)
          if 'OPENAI_' in s or 'openai_api_key' in s or 'openai-api-key' in s:
            raise SystemExit('stale OpenAI deployment reference remains')
          p.write_text(s)
          PY
      - name: Verify patched deployment contracts
        run: node --test tests/unit/gemini-secret-file.test.mjs tests/integration/deployment-config.test.mjs tests/integration/standalone-web.test.mjs
      - run: npm run lint
      - name: Commit patched T18 workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/t18-static-web.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: verify Gemini production deployment'
          git push origin HEAD:build/standalone-production-app
