name: T06 Provider Contract Verification

on:
  push:
    branches:
      - build/standalone-production-app

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --strict-allow-scripts=true --no-audit --no-fund
      - run: node --test tests/unit/provider-contracts.test.mjs tests/unit/provider-input.test.mjs
      - run: npm test
      - run: npm run lint
