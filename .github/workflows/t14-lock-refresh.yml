name: T14 Lockfile Refresh

on:
  push:
    branches:
      - build/standalone-production-app

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/standalone-production-app
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify pinned UI tooling
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.packages?.['node_modules/vite']?.version !== '8.0.16') throw new Error('vite lock pin mismatch');
          if (lock.packages?.['node_modules/@vitejs/plugin-react']?.version !== '6.0.4') throw new Error('plugin-react lock pin mismatch');
          NODE
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: refresh lockfile for T14 UI tooling"
          git push origin HEAD:build/standalone-production-app
