name: Gemini Provider Migration

on:
  push:
    branches:
      - build/standalone-production-app

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --strict-allow-scripts=true --no-audit --no-fund
      - name: Run focused Gemini provider tests
        run: node --test tests/unit/gemini-research.test.mjs tests/unit/gemini-generation.test.mjs
      - run: npm run lint
