name: Gemini TTS Focused Verification

on:
  push:
    branches:
      - build/standalone-production-app

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --strict-allow-scripts=true --no-audit --no-fund
      - run: node --test tests/unit/gemini-tts.test.mjs tests/unit/timed-gemini-tts.test.mjs tests/integration/gemini-tts-wiring.test.mjs
