services:
  app:
    build:
      context: .
    image: bright-profile:standalone
    restart: unless-stopped
    init: true
    command: ["node", "server.mjs"]
    environment:
      PORT: 4180
      BRIGHT_BIND_HOST: 0.0.0.0
      BRIGHT_DATA_DIR: /app/data
      BRIGHT_DATABASE_PATH: /app/data/bright-profile.sqlite
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-30000}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-3}
    volumes:
      - bright-data:/app/data
    ports:
      - "127.0.0.1:${BRIGHT_PORT:-4180}:4180"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4180/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  worker:
    build:
      context: .
    image: bright-profile:standalone
    restart: unless-stopped
    init: true
    command: ["node", "worker.mjs"]
    environment:
      BRIGHT_DATA_DIR: /app/data
      BRIGHT_DATABASE_PATH: /app/data/bright-profile.sqlite
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-30000}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-3}
      FETCH_TIMEOUT_MS: ${FETCH_TIMEOUT_MS:-15000}
      FETCH_MAX_BYTES: ${FETCH_MAX_BYTES:-26214400}
      FETCH_MAX_REDIRECTS: ${FETCH_MAX_REDIRECTS:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_RESEARCH_MODEL: ${OPENAI_RESEARCH_MODEL:-gpt-5}
      OPENAI_GENERATION_MODEL: ${OPENAI_GENERATION_MODEL:-gpt-5}
      OPENAI_API_TIMEOUT_MS: ${OPENAI_API_TIMEOUT_MS:-60000}
      OPENAI_API_MAX_RETRIES: ${OPENAI_API_MAX_RETRIES:-2}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-application-credentials.json
      REMOTION_BROWSER_EXECUTABLE: /usr/bin/chromium
    volumes:
      - bright-data:/app/data
      - ${GOOGLE_APPLICATION_CREDENTIALS_FILE:-./.secrets/google-application-credentials.json}:/run/secrets/google-application-credentials.json:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  bright-data:
